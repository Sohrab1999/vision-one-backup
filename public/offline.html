<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>آفلاین هستید — کتابخانه ویژن</title>
<meta name="theme-color" content="#059669" />
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Vazirmatn", "Segoe UI", Tahoma, Arial, sans-serif;
    background: linear-gradient(160deg, #14231d 0%, #0c2b21 55%, #06382b 100%);
    color: #e7f6ee;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(52, 211, 153, 0.22);
    border-radius: 24px;
    padding: 40px 28px 36px;
    backdrop-filter: blur(8px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
  }
  .emoji {
    font-size: 64px;
    line-height: 1;
    display: inline-block;
    margin-bottom: 20px;
    filter: drop-shadow(0 6px 18px rgba(16, 185, 129, 0.35));
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 12px;
    color: #ffffff;
  }
  p {
    font-size: 15px;
    line-height: 2;
    color: #b9dccb;
    margin-bottom: 26px;
  }
  .accent {
    width: 72px;
    height: 5px;
    border-radius: 999px;
    background: linear-gradient(90deg, #10b981, #f59e0b);
    margin: 0 auto 26px;
  }
  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #052e22;
    background: linear-gradient(135deg, #34d399, #059669);
    border: none;
    border-radius: 14px;
    padding: 13px 36px;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(5, 150, 105, 0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:hover { filter: brightness(1.07); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  .dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #f59e0b;
    margin-inline-end: 8px;
    vertical-align: middle;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .status { font-size: 12.5px; color: #8fb8a3; margin-top: 22px; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
</style>
</head>
<body>
  <main class="card">
    <span class="emoji" aria-hidden="true">📗</span>
    <h1>آفلاین هستید</h1>
    <div class="accent" aria-hidden="true"></div>
    <p>اتصال اینترنت برقرار نیست — کتاب آخر بازدیدشده پس از بازگشت آنلاین در دسترس است</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
    <div class="status"><span class="dot" aria-hidden="true"></span>به‌محض وصل‌شدن دوباره، همین صفحه بازخوانی می‌شود</div>
  </main>
</body>
</html>
